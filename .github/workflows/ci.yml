name: Frontend CI

on:
  push:
    branches:
      - dev-v2
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint application and scripts
        run: npm run lint

      - name: Type-check Vue and TypeScript
        run: npm run typecheck

      - name: Run source guards
        run: npm run test:guards

      - name: Build production bundle
        run: npx vite build

      - name: Audit dependencies
        run: npm run audit

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: offerlab-frontend-dist
          path: dist
          if-no-files-found: error
